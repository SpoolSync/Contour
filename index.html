<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contour Body Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column, a measured body figure as the centrepiece, numbers set large in the display face, tab bar pinned to the bottom. */
:root{
  --bg:#ECEFF1; --surface:#FFFFFF; --sunk:#E2E7EA; --ink:#0F1D26; --muted:#5A6A75; --line:#D3DADF;
  --accent:#F2541B; --accent-ink:#FFFFFF; --scan:#0B8E89; --part:#C4CED5; --neutral:#DCE2E6;
  --good:#1C9A5F; --watch:#BF8200; --high:#CF2F5A;
  --display:"Bricolage Grotesque","Avenir Next Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1317; --surface:#141D23; --sunk:#1B262D; --ink:#EAF0F3; --muted:#8D9EA9; --line:#27343C;
    --accent:#FF6A33; --accent-ink:#1A0B04; --scan:#37C8C1; --part:#3A4A54; --neutral:#26333B;
    --good:#3CC486; --watch:#E3A92B; --high:#F0668A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1317; --surface:#141D23; --sunk:#1B262D; --ink:#EAF0F3; --muted:#8D9EA9; --line:#27343C;
  --accent:#FF6A33; --accent-ink:#1A0B04; --scan:#37C8C1; --part:#3A4A54; --neutral:#26333B;
  --good:#3CC486; --watch:#E3A92B; --high:#F0668A; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--scan);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 6px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:500;font-size:13px}
main{flex:1;overflow-y:auto;padding:8px 18px 24px;display:flex;flex-direction:column;gap:14px}
nav.tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 8px 8px}
nav.tabs button{background:none;border:0;padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:12px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.025em;line-height:1.05;margin:4px 0 0;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.banner{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px}
.banner button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:8px 14px;font-weight:600;white-space:nowrap}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:13px 16px;font-weight:600;font-size:15px;width:100%}
.btn.alt{background:var(--sunk);color:var(--ink)}
.btn:disabled{opacity:.5}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:var(--sunk)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-good{color:var(--good)} .st-watch{color:var(--watch)} .st-high{color:var(--high)} .st-none{color:var(--muted)}
/* today */
.ringwrap{display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .mid .num{font-size:30px;line-height:1}
.ring .mid small{color:var(--muted);font-size:11.5px}
.macro{display:flex;flex-direction:column;gap:9px}
.macro div.m{display:grid;grid-template-columns:62px 1fr auto;gap:8px;align-items:center;font-size:13px}
.bar{height:7px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--scan)}
.meal h2{display:flex;justify-content:space-between;align-items:baseline}
.meal h2 span{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.entry{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.entry b{font-weight:600;display:block;overflow-wrap:anywhere}
.entry small{color:var(--muted);font-size:12.5px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;font-size:17px;line-height:1}
.step span{min-width:28px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.add{background:none;border:1px dashed var(--line);border-radius:12px;padding:10px;font-weight:600;color:var(--scan);width:100%}
/* figure */
.figwrap{position:relative;display:flex;justify-content:center}
.fig{width:100%;max-width:170px;height:auto;display:block}
.fig .nt{fill:var(--neutral)}
.fig .rg{fill:var(--part);transition:fill .2s}
.fig .rg.pick{cursor:pointer}
.fig .rg.pick:hover{fill:color-mix(in srgb,var(--accent) 45%,var(--part))}
.fig .rg.on{fill:var(--accent)}
.fig .rg.f-good{fill:var(--good)} .fig .rg.f-watch{fill:var(--watch)} .fig .rg.f-high{fill:var(--high)} .fig .rg.f-track{fill:var(--scan)}
.sweep{position:absolute;left:0;right:0;top:0;height:3px;background:var(--scan);box-shadow:0 0 18px 6px color-mix(in srgb,var(--scan) 55%,transparent);opacity:0;pointer-events:none}
.scanning .sweep{animation:sweep 1.7s ease-in-out 1}
@keyframes sweep{0%{top:0;opacity:1}100%{top:100%;opacity:1}}
@media (prefers-reduced-motion: reduce){.scanning .sweep{animation:none}.fig .rg{transition:none}}
.overview{display:grid;grid-template-columns:minmax(120px,42%) 1fr;gap:14px;align-items:center}
.reads{display:flex;flex-direction:column}
.read{display:grid;grid-template-columns:1fr auto;gap:6px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
.read:last-child{border-bottom:0}
.read .v{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.read .d{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px}
.stat .num{font-size:30px;line-height:1}
.stat .num small{font-size:14px;font-weight:700;color:var(--muted);margin-left:2px}
.stat label{font-size:12.5px;color:var(--muted)}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg);border-radius:14px;padding:14px 8px 10px}
.pair figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.pair figcaption{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.fig .rg.pick path{stroke:transparent;stroke-width:6}
.note{border-left:3px solid var(--scan);padding:2px 0 2px 12px;font-size:13.5px;color:var(--muted)}
.note b{color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.week i{display:block;font-style:normal;height:30px;border-radius:9px;background:var(--sunk);margin-top:4px;line-height:30px;color:var(--ink)}
.week .now i{outline:2px solid var(--ink)}
.week .ok i{background:var(--good);color:#fff}
details.day{border-top:1px solid var(--line);padding:10px 0}
details.day:first-of-type{border-top:0}
details.day summary{list-style:none;display:grid;grid-template-columns:40px 1fr auto;gap:8px;align-items:center;cursor:pointer}
details.day summary::-webkit-details-marker{display:none}
details.day summary .dw{font-family:var(--display);font-weight:700;color:var(--muted)}
details.day[open] summary .dw,details.day.now summary .dw{color:var(--accent)}
details.day summary small{color:var(--muted)}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0 0 48px;font-size:13.5px}
.ex b{font-weight:600}
.ex .dose{font-variant-numeric:tabular-nums;font-weight:600;color:var(--scan)}
.ex small{grid-column:1/-1;color:var(--muted)}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-left:6px}
/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px;position:relative}
.bars .b{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:10.5px;color:var(--muted)}
.bars .b i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--scan);min-height:2px}
.bars .b.over i{background:var(--watch)}
.tline{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);opacity:.6}
/* sheet */
#sheet{position:absolute;inset:0;background:rgba(6,12,16,.55);display:none;align-items:flex-end;z-index:5}
#sheet.open{display:flex}
.panel{background:var(--surface);width:100%;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel .hd{display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--sunk);border-radius:50%;width:34px;height:34px;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:500}
.f input,.f select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;color:var(--ink);width:100%}
.f small{font-weight:400}
.err{color:var(--high);font-size:13px;font-weight:500;min-height:1em}
.foodrow{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.foodrow b{font-weight:600}
.foodrow small{color:var(--muted);display:block;font-size:12.5px}
.foodrow button{border:0;background:var(--sunk);border-radius:999px;padding:7px 13px;font-weight:600;color:var(--scan)}
.list{max-height:240px;overflow-y:auto}
.ai{background:var(--bg);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.ai textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:16px;color:var(--ink);min-height:62px;resize:vertical;width:100%}
.filebtn{position:relative;overflow:hidden;text-align:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sync{font-size:11.5px;color:var(--muted)}
.scale{position:relative;display:flex;height:10px;border-radius:99px;overflow:hidden;margin-top:14px}
.scale i{display:block;height:100%}
.scalewrap{position:relative;padding-bottom:18px}
.scalewrap .mk{position:absolute;top:8px;width:4px;height:22px;border-radius:2px;background:var(--ink);transform:translateX(-2px);outline:2px solid var(--surface)}
.scalewrap .tk{position:absolute;top:28px;font-size:10.5px;color:var(--muted);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.src{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--scan);margin-left:6px}
.lib details{border-top:1px solid var(--line);padding:10px 0}
.lib summary{cursor:pointer;list-style:none;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:baseline}
.lib summary::-webkit-details-marker{display:none}
.lib summary b{font-weight:600}
.lib summary small,.lib p{color:var(--muted);font-size:12.5px}
.lib p{margin:8px 0 0;font-size:13.5px}
.tabsrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabsrow button{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap;color:var(--muted)}
.tabsrow button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--muted)}
.check input{width:18px;height:18px;margin-top:1px;accent-color:var(--scan)}
.links a{color:var(--scan);font-weight:600}
.gated nav.tabs,.gated #btn-profile,.gated #btn-help{display:none}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;letter-spacing:.08em;font-size:15px}
.coderow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.coderow small{display:block;color:var(--muted);font-size:12px}
.coderow button{border:0;background:var(--sunk);border-radius:999px;padding:6px 12px;font-weight:600;font-size:12.5px}
.owner{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hl{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.hl li{display:grid;grid-template-columns:10px 1fr;gap:10px;align-items:baseline;font-size:14px}
.hl li::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;transform:translateY(-1px)}
.hl li span{color:var(--ink)}
.water{display:flex;gap:5px;flex-wrap:wrap}
.water i{width:20px;height:26px;border-radius:5px 5px 9px 9px;background:var(--sunk);display:block}
.water i.on{background:var(--scan)}
#app:not(.standalone) nav.tabs [data-tab="check"]{display:none}
nav.tabs [data-tab="progress"]{display:none}
#app.standalone nav.tabs [data-tab="reports"]{display:none}
.backrow{border:0;background:none;color:var(--scan);font-weight:600;font-size:14px;padding:0;align-self:flex-start}
.hero{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .num{font-size:40px;line-height:1}
.hero small{color:color-mix(in srgb,var(--bg) 70%,transparent);font-size:13px}
.hero .bar{background:color-mix(in srgb,var(--bg) 18%,transparent)}
.hero .bar i{background:var(--accent)}
.hero .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero .acts .btn.alt{background:color-mix(in srgb,var(--bg) 14%,transparent);color:var(--bg)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:0;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left;min-height:118px}
.tile label{font-size:12.5px;color:var(--muted);cursor:inherit}
.tile .num{font-size:26px;line-height:1.1}
.tile .num small{font-size:13px;font-weight:700;color:var(--muted);margin-left:2px}
.tile .sub{margin-top:auto}
.tile .mini{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:auto}
.tile .mini button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:none;font-size:18px;line-height:1}
.ro .act{display:none}
.notice h3{font-family:var(--display);font-size:15px;margin:6px 0 0}
.notice p,.notice li{font-size:14px;color:var(--ink);margin:0}
.notice ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.ck{position:relative;cursor:pointer}
.ck input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.ck:has(input:checked){background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ck:has(input:focus-visible){outline:2px solid var(--scan);outline-offset:2px}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lv div{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.lv b{font-family:var(--display);font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
#qr-reader{border-radius:14px;overflow:hidden;background:#000;min-height:220px}
#qr-reader video{width:100%;display:block}
#app:not(.trainer) nav.tabs [data-tab="clients"]{display:none}
#app.trainer nav.tabs{grid-template-columns:1fr 1fr}
#app.trainer nav.tabs button:not([data-tab="clients"]):not([data-tab="texs"]){display:none}
.ro #btn-profile,.ro .add,.ro .step button,.ro [data-act="newscan"],.ro [data-act="done"],.ro form[data-form="weight"]{display:none}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav button{border:1px solid var(--line);background:none;border-radius:999px;width:38px;height:38px;font-size:18px}
.daynav button:disabled{opacity:.3}
.client{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.client:first-of-type{border-top:0}
.client b{font-weight:600;display:block}
.client small{color:var(--muted);font-size:12.5px}
.idbox{background:var(--bg);border-radius:12px;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;overflow-wrap:anywhere;max-height:74px;overflow:auto}
.fig .ghost{fill:none;stroke:var(--muted);stroke-width:1.2;stroke-dasharray:3 3;opacity:.7;pointer-events:none}
.figkey{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.figkey span{display:inline-flex;align-items:center;gap:6px}
.figkey i{display:inline-block;width:18px;height:0;border-top:1.5px dashed var(--muted)}
.wins li::before{background:var(--good)}
.excard{border-top:1px solid var(--line);padding:10px 0}
.excard:first-of-type{border-top:0}
.excard summary{cursor:pointer;list-style:none;display:flex;flex-direction:column;gap:3px}
.excard summary::-webkit-details-marker{display:none}
.excard summary b{font-weight:600}
.excard summary small{color:var(--muted);font-size:12.5px}
.excard .body{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:13.5px}
.excard .body ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.excard .warn{border-left:3px solid var(--watch);padding:2px 0 2px 10px}
.author{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--sunk);color:var(--scan);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}
.author.mine{background:var(--scan);color:#fff}
.f textarea,.f select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;color:var(--ink);width:100%}
.timer{font-family:var(--display);font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.wkrow{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.wkrow input{width:22px;height:22px;accent-color:var(--good);margin-top:2px}
.wkrow small{display:block;color:var(--muted)}
#app:not(.cloudapp) nav.tabs [data-tab="texs"]{display:none}
#app:not(.trainer) nav.tabs [data-tab="texs"]{display:none}
#app.onboard nav.tabs,#app.onboard #btn-profile,#app.onboard #btn-help,#app.loading nav.tabs{display:none}
.ob{display:flex;flex-direction:column;gap:16px;padding-bottom:8px;animation:obin .25s ease}
@keyframes obin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.obtop{display:flex;align-items:center;gap:12px}
.obback{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;color:var(--ink);flex:none}
.obbar{flex:1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.obbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.ob h1{font-size:30px}
.ob .why{margin:-8px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
.obhero{display:flex;flex-direction:column;gap:12px;padding:28px 0 6px}
.obvals{display:flex;flex-direction:column;gap:10px}
.obvals div{background:var(--surface);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:3px;border-left:4px solid var(--accent)}
.obvals small{color:var(--muted);font-size:13px}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:15px 16px;text-align:left;display:flex;flex-direction:column;gap:3px;color:var(--ink);font:inherit;transition:border-color .15s,transform .1s}
.opt:active{transform:scale(.98)}
.opt b{font-size:16px}
.opt small{color:var(--muted);font-size:13px;line-height:1.35}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.obfoot{display:flex;gap:10px;margin-top:4px;position:sticky;bottom:0;padding-top:8px;background:linear-gradient(transparent,var(--bg) 30%)}
.obfig{max-height:330px}
.obfig svg{max-height:330px}
.obhealth details summary{display:none}
.obhealth details > div > p.sub:first-child{display:none}
.gsrow{display:flex;align-items:center;gap:12px;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;text-align:left;font:inherit;color:var(--ink);font-weight:600;font-size:14.5px}
.gsrow span:nth-child(2){flex:1}
.gsrow .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff;flex:none}
.gsrow.ok{color:var(--muted);text-decoration:line-through}
.gsrow.ok .tick{background:var(--good);border-color:var(--good)}
.invite{display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--scan) 12%,var(--surface));border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:500}
.pillbtn{background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.pillbtn.alt{background:var(--sunk);color:var(--ink)}
#tour{position:absolute;inset:0;z-index:9;pointer-events:auto}
.tour-hl{position:absolute;border-radius:14px;box-shadow:0 0 0 9999px rgba(6,12,16,.62);transition:all .25s;pointer-events:none;outline:2px solid var(--accent)}
.tour-tip{position:absolute;left:14px;right:14px;background:var(--surface);color:var(--ink);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:obin .2s ease}
.tour-tip p{margin:0;font-size:14px;line-height:1.45;color:var(--muted)}
#toast{position:absolute;left:16px;right:16px;bottom:86px;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:500;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:8}
#toast.on{opacity:1;transform:none;pointer-events:auto}
#toast .linkbtn{color:var(--accent);font-size:14px}
.example{opacity:.55;border:1.5px dashed var(--line);background:transparent;position:relative}
.example .extag{position:absolute;top:10px;right:12px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.skel{background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r)}
@keyframes sk{to{background-position:-200% 0}}
.scanbox{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanframe{position:absolute;inset:20% 8%;border:3px solid rgba(255,255,255,.9);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.scanframe i{position:absolute;left:6%;right:6%;top:50%;height:2px;background:var(--accent);animation:scanline 1.6s ease-in-out infinite alternate}
@keyframes scanline{from{top:15%}to{top:85%}}
.torch{position:absolute;right:10px;bottom:10px;border:0;border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.9);font-weight:600;font-size:13px}
.ingr summary{cursor:pointer;font-weight:600}
.ingr p{margin:8px 0 4px;font-size:13.5px;line-height:1.5}
.ingr b{color:var(--high)}
.draftnote{margin:0;font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:8px 10px}
.draftnote .linkbtn{font-size:12.5px;color:var(--scan)}
.nfadd{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px}
.nfadd button{color:var(--scan);font-size:12.5px}
.pphoto{display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--sunk);border-radius:14px;padding:10px;min-height:60px;justify-content:center}
.pphoto img{max-width:100%;max-height:220px;border-radius:10px;object-fit:contain;background:#fff}
.pphoto small{color:var(--muted);font-size:11.5px}
.pphoto .linkbtn{font-size:11.5px;color:var(--scan)}
.photoadd{border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:14px;width:100%;display:flex;flex-direction:column;gap:3px;color:var(--ink);font:inherit;text-align:center}
.photoadd small{color:var(--muted);font-size:12px}
.foodrow .thumb{width:38px;height:38px;border-radius:8px;object-fit:contain;background:#fff;flex:none}
.npphoto img{max-height:160px;border-radius:10px}
.linkbtn{border:0;background:none;color:var(--high);font-weight:600;font-size:12px;padding:0}
</style>
</head>

async function readFoodsPlain(k){

async function publishCodes(rotate, all){

// Outside Claude the app runs as an installable web app: files are shared through the phone's share sheet or saved as downloads.
const STANDALONE = !(window.claude && window.claude.use);
if (STANDALONE){
  dlFn = {save: async ({filename, data}) => {
    const blob = data instanceof Blob ? data : new Blob([data], {type:/\.json$/.test(filename) ? "application/json" : "text/plain"});
    try { const file = new File([blob], filename, {type:blob.type || "image/png"});
      if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Contour"}); return {status:"saved"}; } }
    catch(e){ if (e && e.name === "AbortError") throw {code:"declined"}; }
    const a = document.createElement("a"), url = URL.createObjectURL(blob); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000);
    return {status:"saved"}; }};
  if (/^https?:$/.test(location.protocol)){
    const add = (tag, attrs) => { const el = document.createElement(tag); for (const k in attrs) el.setAttribute(k, attrs[k]); document.head.appendChild(el); };
    add("link", {rel:"manifest", href:"manifest.webmanifest"}); add("link", {rel:"apple-touch-icon", href:"icon-180.png"});
    add("meta", {name:"theme-color", content:"#0F1D26"}); add("meta", {name:"apple-mobile-web-app-capable", content:"yes"}); add("meta", {name:"apple-mobile-web-app-title", content:"Contour"});
    if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
(function boot(){
  let h = ""; try { h = location.hash.slice(1); } catch(e){}
  tab = TABS.includes(h) ? h : "home";
  render();
  initAccess().then(render);
  initCloud().then(trainerInit);
  trainerInit();
  if (STANDALONE && CLOUD){ sampleFn = geminiFn; canImages = true; }
  if (CLOUD && window.PixoraUsage) PixoraUsage.init("contour", "contour-2026-11-21", () => fdb && cuser ? fdb : null);
  if (window.claude && window.claude.use) window.claude.use("downloads").then(d => { if (d){ dlFn = d; if (tab === "reports") render(); } }).catch(() => {});
  if (window.claude && window.claude.use) window.claude.use("sample").then(async s => {
    if (!s) return; sampleFn = s;
    try { const lim = await s.limits(); canImages = !!(lim && lim.images); } catch(e){}
  }).catch(() => {});
})();
</script>
